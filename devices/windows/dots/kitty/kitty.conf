# Kitsu (native kitty fork, github.com/fhaze/kitsu): the shared kitty.conf plus the few lines Windows needs.
# Linked to ~/.config/kitty/kitty.conf (Kitsu reads that, not %APPDATA% like its README says) by scripts/link-windows-dots.ps1.
include ${USERPROFILE}/dotfiles/dots/kitty/kitty.conf

# fish only exists through MSYS2/Cygwin here, and that's what made cd slow.
# pwsh with devices/windows/dots/pwsh/profile.ps1 gives the same prompt/abbrs natively.
# kitsu-shell.cmd starts fastfetch next to pwsh (full path inside, it's per-user)
shell cmd.exe /d /c ${USERPROFILE}/dotfiles/devices/windows/dots/kitty/kitsu-shell.cmd
# shell C:\msys64\usr\bin\fish.exe -l

# background_opacity stays solid on NVIDIA unless NVIDIA Control Panel >
# Manage 3D settings > Program settings > kitsu.exe has
# "Vulkan/OpenGL present method" set to "Prefer native".

# no unix sockets for remote control on Windows
allow_remote_control no

# The shared binds use cmd, which is the Win key here, and Explorer keeps Win+anything for
# itself. So the Mac's cmd binds are on Ctrl, like in a browser. kitty gets these keys
# before the program inside, so nvim loses Ctrl+W (window commands) and Ctrl+T.
# Left alone on purpose: Ctrl+V (pwsh pastes on it by itself, nvim keeps block select),
# Ctrl+N (nvim completion) and Ctrl+[ (that's Esc). Ctrl+Tab switches tabs.
map ctrl+t new_tab
map ctrl+w close_tab
# copies when something is selected (and clears it, so the next Ctrl+C interrupts again)
map ctrl+c copy_and_clear_or_interrupt
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
# Kitsu calls the = key "plus" (Windows names it VK_OEM_PLUS), so ctrl+equal alone never fires
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
