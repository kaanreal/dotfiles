# kitty.conf generated by Confitty on 2026-08-06
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family Hack
font_size 12
disable_ligatures cursor

# --- Cursor ---
cursor #ffe4a8
cursor_text_color #ffe4a8
shell_integration no-cursor
cursor_shape block
cursor_shape_unfocused block
cursor_underline_thickness 1.5
cursor_blink_interval 0.5
cursor_trail 20
cursor_trail_color #ffe4a8
cursor_trail_start_threshold 10

# --- Scrollback ---
scrollback_lines 10000
touch_scroll_multiplier 1.5
pixel_scroll yes
scrollbar 

# --- Mouse ---
url_color #7aa2f7
underline_hyperlinks always
copy_on_select clipboard

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.2

# --- Window Layout ---
remember_window_position yes
window_border_width 1pt
window_padding_width 20
active_border_color #bb9af7
inactive_text_alpha 0.7
hide_window_decorations no
confirm_os_window_close 0

# --- Tab Bar ---
tab_bar_align center
tab_powerline_style slanted
active_tab_foreground #c0caf5
active_tab_background #bb9af7
inactive_tab_foreground #868dad
inactive_tab_background #3f4254
inactive_tab_font_style bold-italic

# --- Colors ---
foreground #c0caf5
background #1a1b26
background_opacity 0.65
selection_foreground #1a1b26
selection_background #283457
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# --- Advanced ---
allow_remote_control socket-only

# --- Keyboard Shortcuts ---
map cmd+t new_tab
map cmd+w close_tab
map cmd+] next_tab
map cmd+[ previous_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

