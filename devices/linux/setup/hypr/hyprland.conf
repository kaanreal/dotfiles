# kaan's minimal Hyprland config for Arch.
# The full desktop experience lives on NixOS (Caelestia); this is a
# lightweight, predictable fallback that reuses the shared dotfiles.

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

monitor = DP-1,2560x1440@180,auto,1
monitor = ,preferred,auto,1

exec-once = waybar
exec-once = mako
exec-once = swww init && swww img ~/.config/wallpaper.png
exec-once = xdg-desktop-portal-hyprland
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = swayidle -w timeout 300 'swaylock -f' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

input {
    kb_layout = de
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7ebae4ee) rgba(ffffff66) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    cursor_inactive_timeout = 5
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.9
    shadow {
        enabled = true
        range = 20
        render_power = 3
    }
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.2
    }
}

animations {
    enabled = true
    bezier = ease,0.25,0.1,0.25,1
    animation = windows,1,3,ease
    animation = windowsOut,1,3,default
    animation = fade,1,3,ease
    animation = workspaces,1,3,default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mod = SUPER
bind = $mod, RETURN, exec, kitty
bind = $mod, SPACE, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, swaylock -f
bind = $mod, R, exec, wofi --show run
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrulev2 = suppressevent maximize, class:.*
