# Colors
foreground			#dadada
background			#181f21
selection_foreground		#dadada
selection_background		#3b4244
color0				#232a2d
color1				#e57474
color2				#8ccf7e
color3				#e5c76b
color4				#67b0e8
color5				#c47fd5
color6				#6cbfbf
color7				#b3b9b8
color8				#2d3437
color9				#ef7e7e
color10				#96d988
color11				#f4d67a
color12				#71baf2
color13				#ce89df
color14				#67cbe7
color15				#bdc3c2

# Tabs
active_tab_foreground   	#E182E0
active_tab_background   	#1b2224
inactive_tab_foreground 	#cd69cc
inactive_tab_background 	#232a2c
tab_bar_edge 			bottom 
tab_bar_style 			powerline 
tab_separator 			"|"

# Cursor
cursor				#bdc3c2
cursor_shape			Underline
cursor_underline_thickness	1

# Terminal fonts
font_family			family="JetBrainsMono Nerd Font Mono"
bold_font			auto
italic_font			auto
bold_italic_font		auto
font_size			11.0

# Window settings 
remember_window_size		no
initial_window_width		875
initial_window_height		515
window_padding_width		10

# Miscellaneous
disable_ligatures		never
enable_audio_bell		no
shell				fish
shell_integration		no-cursor
url_color			#fff
url_style			curly

# Per-OS overrides — kitty sets $KITTY_OS (linux / macos / bsd), so this
# includes macos.conf on macOS and linux.conf on NixOS/Arch. Edit those
# files (not this one) for machine-specific tweaks.
include ${KITTY_OS}.conf
