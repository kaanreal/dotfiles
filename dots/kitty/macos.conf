# macOS-only kitty overrides — included from kitty.conf via ${KITTY_OS}.
# Tweaks the MacBook (Retina scaling, opacity, cmd-based shortcuts, the
# beige palette that matches dots/fish/conf.d/theme.fish).

# Fonts (slightly bigger on Retina, non-Mono variant)
font_family				family="JetBrainsMono Nerd Font"
font_size				12.0

# Cursor
cursor_shape			beam
cursor_beam_thickness	1.5
cursor					#C15F3C
cursor_text_color		#e8e6e3

# Window look
background_opacity		0.78
dynamic_background_opacity	yes
window_padding_width		25
scrollback_lines		10000

# macOS-friendly tab keybindings
map cmd+t new_tab
map cmd+w close_tab
map cmd+] next_tab
map cmd+[ previous_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Absolute path to Homebrew fish (not on PATH when kitty starts from the app)
shell						/opt/homebrew/bin/fish

# Beige palette (matches the fish theme)
foreground					#e8e6e3
background					#0a0f0f
selection_foreground		#e8e6e3
selection_background		#C15F3C

# black
color0						#3a352b
color8						#6a6158

# red
color1						#C15F3C
color9						#e8a87c

# green
color2						#7db87d
color10						#9acc9a

# yellow
color3						#d4a96a
color11						#e8c88a

# blue
color4						#7a9ec2
color12						#9ab8d8

# magenta
color5						#a87ab8
color13						#c49ad4

# cyan
color6						#6eb8b8
color14						#8ed4d4

# white
color7						#e8e6e3
color15						#f5f0eb

# Tabs
active_tab_foreground		#e8e6e3
active_tab_background		#C15F3C
inactive_tab_foreground		#9a9389
inactive_tab_background		#332C25
tab_bar_background			#261F1A
